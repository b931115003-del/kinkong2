<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金剛爬塔</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#09091a;--gold:#f5a623;--teal:#00c8f0;--red:#e94560;--green:#06d6a0;--text:#e0e0f0;--text2:#6060a0;}
body{background:var(--bg);background-image:radial-gradient(ellipse at 20% 0%,#180838 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,#081828 0%,transparent 50%);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:0 8px 14px;overflow-x:hidden;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;font-size:12.5px;font-weight:600;border-radius:9px;cursor:pointer;transition:all .17s;border:1px solid #282858;color:#c0c0e8;background:linear-gradient(155deg,#1e1e40,#111128);box-shadow:0 3px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);}
.btn:hover{border-color:rgba(0,200,240,.4);color:var(--teal);transform:translateY(-2px);}
.btn:active{transform:translateY(1px);}
.btn-red{background:linear-gradient(135deg,#e94560,#8e1830);border:none;color:#fff;box-shadow:0 3px 16px rgba(233,69,96,.4),inset 0 1px 0 rgba(255,255,255,.12);}
.btn-red:hover{transform:translateY(-2px);}
.btn-green{background:linear-gradient(135deg,#06b060,#047a40);border:none;color:#fff;}
.btn-green:hover{transform:translateY(-2px);}

/* LOBBY */
#lobby{width:100%;max-width:440px;margin-top:16px;}
.card{background:linear-gradient(145deg,#141430,#0a0a1e);border:1px solid #252560;border-radius:18px;padding:26px 22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.7);}
.ltitle{font-size:26px;font-weight:900;color:var(--gold);text-align:center;letter-spacing:2px;text-shadow:0 0 24px rgba(245,166,35,.5);}
.lsub{font-size:12px;color:var(--text2);text-align:center;margin:4px 0 18px;line-height:1.5;}
.field{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.field label{font-size:12px;color:var(--text2);flex-shrink:0;width:48px;}
.field input{flex:1;background:#0a0a20;border:1px solid #252550;border-radius:8px;padding:9px 12px;font-size:14px;color:var(--text);font-family:inherit;outline:none;}
.field input:focus{border-color:rgba(100,80,200,.5);}
.sep{display:flex;align-items:center;gap:10px;margin:12px 0;}
.sep-line{flex:1;height:1px;background:#1e1e40;}
.sep-txt{font-size:11px;color:#2a2a60;letter-spacing:1px;}
.diff-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px;}
.diff-btn{padding:9px 6px;border-radius:9px;cursor:pointer;border:1px solid #252550;background:#0e0e28;color:var(--text2);font-size:12px;font-weight:700;text-align:center;transition:all .17s;line-height:1.4;}
.diff-btn span{display:block;font-size:10px;font-weight:400;margin-top:2px;opacity:.7;}
.lbtn{width:100%;padding:13px;font-size:14px;font-weight:800;border-radius:12px;border:none;cursor:pointer;transition:all .17s;letter-spacing:.4px;margin-bottom:9px;color:#fff;}
.lbtn:last-child{margin-bottom:0;}
.lbtn:hover{transform:translateY(-2px);}
.code-inp{width:100%;background:#0a0a20;border:1px solid #252550;border-radius:8px;padding:9px 12px;font-size:20px;font-weight:700;color:var(--gold);letter-spacing:5px;text-align:center;font-family:monospace;outline:none;margin-bottom:8px;}
.code-inp:focus{border-color:rgba(0,200,240,.5);}
.wdot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* GAME */
#game{display:none;width:100%;max-width:560px;}
header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;gap:8px;flex-wrap:wrap;}
.logo{font-size:18px;font-weight:900;letter-spacing:2px;color:var(--gold);}

/* HUD */
.hud{width:100%;background:linear-gradient(145deg,#111130,#0a0a1e);border:1px solid #1e1e44;border-radius:12px;padding:10px 14px;margin-bottom:6px;}
.hud-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.hb{text-align:center;min-width:48px;}
.hb-val{font-size:17px;font-weight:800;line-height:1;}
.hb-lbl{font-size:9px;color:var(--text2);margin-top:2px;letter-spacing:.8px;text-transform:uppercase;}
.hud-div{width:1px;height:28px;background:#1e1e44;flex-shrink:0;}
.hbar-wrap{flex:1;display:flex;flex-direction:column;gap:4px;}
.hbar-bg{height:4px;background:#1a1a38;border-radius:2px;overflow:hidden;}
.hbar-fill{height:100%;border-radius:2px;transition:width .2s;}

/* OPP INFO */
.opp-row{display:none;width:100%;background:rgba(0,200,240,.05);border:1px solid rgba(0,200,240,.2);border-radius:10px;padding:9px 14px;margin-bottom:5px;}
.opp-row.show{display:block;}

/* INVITE */
.invite-row{display:none;width:100%;background:rgba(6,214,160,.05);border:1px solid rgba(6,214,160,.2);border-radius:10px;padding:10px 14px;margin-bottom:5px;}
.invite-row.show{display:block;}

/* CANVAS */
.canvas-wrap{position:relative;width:100%;}
#gc{display:block;border-radius:12px;image-rendering:pixelated;width:100%;outline:none;cursor:pointer;box-shadow:0 8px 40px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.04);}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;gap:9px;background:rgba(5,5,20,.9);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s;}
.ov.show{opacity:1;pointer-events:all;}
.ov-em{font-size:50px;line-height:1;}
.ov-ttl{font-size:21px;font-weight:900;text-align:center;}
.ov-ttl.gold{color:var(--gold);}
.ov-ttl.red{color:var(--red);}
.ov-sub{font-size:12px;color:var(--text2);text-align:center;max-width:260px;line-height:1.6;}
.ov-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px;}

/* DPAD */
.ctrl-row{display:flex;align-items:center;justify-content:center;gap:14px;margin:7px 0 3px;}
.dpw{padding:9px;border-radius:16px;background:linear-gradient(145deg,#111128,#0a0a1a);border:1px solid #1e1e40;box-shadow:0 5px 20px rgba(0,0,0,.55);}
.dp{display:grid;grid-template-areas:". up ." "left . right";gap:4px;}
.db{width:52px;height:52px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;color:#9090c8;background:linear-gradient(145deg,#232345,#141432);border:1px solid #2e2e60;box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07),inset 0 -2px 0 rgba(0,0,0,.45);transition:all .1s;position:relative;overflow:hidden;}
.db::after{content:'';position:absolute;top:0;left:0;right:0;height:42%;background:linear-gradient(to bottom,rgba(255,255,255,.07),transparent);pointer-events:none;}
.db.up{grid-area:up;border-radius:11px 11px 5px 5px;}
.db.left{grid-area:left;border-radius:11px 5px 5px 11px;}
.db.right{grid-area:right;border-radius:5px 11px 11px 5px;}
.db:active,.db.pressed{color:var(--red);border-color:var(--red);background:linear-gradient(145deg,#180a10,#0e0608);box-shadow:0 1px 3px rgba(0,0,0,.5),inset 0 2px 5px rgba(0,0,0,.5);transform:scale(.93);}
.jb{width:54px;height:54px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;background:linear-gradient(135deg,#e94560,#8e1830);border:none;color:#fff;box-shadow:0 4px 16px rgba(233,69,96,.4),inset 0 1px 0 rgba(255,255,255,.15);}
.jb:active{transform:scale(.92);}
.hint{font-size:10px;color:#2a2a56;text-align:center;margin-bottom:4px;}

/* CHAT */
.chat{display:none;background:linear-gradient(145deg,#0e0e28,#080818);border:1px solid #1a1a3a;border-radius:12px;overflow:hidden;margin-top:6px;width:100%;max-width:100%;}
.chat.show{display:block;}
.chat-hdr{padding:7px 12px 5px;border-bottom:1px solid #161630;display:flex;align-items:center;gap:8px;}
.cdot{width:7px;height:7px;border-radius:50%;background:#3a3a68;flex-shrink:0;}
.cdot.on{background:var(--green);box-shadow:0 0 6px rgba(6,214,160,.5);animation:pulse 2s infinite;}
.chat-msgs{height:130px;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:4px;}
.chat-msgs::-webkit-scrollbar{width:3px;}
.chat-msgs::-webkit-scrollbar-thumb{background:#1e1e3a;border-radius:2px;}
.cm{display:flex;flex-direction:column;gap:1px;animation:fu .2s;}
@keyframes fu{from{opacity:0;transform:translateY(3px);}to{opacity:1;}}
.cm.me{align-self:flex-end;}.cm.op{align-self:flex-start;}.cm.sy{align-self:center;}
.cm-meta{display:flex;align-items:center;gap:4px;padding:0 3px;}
.cm.me .cm-meta{flex-direction:row-reverse;}
.cm-ava{width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;}
.cm-name{font-size:9.5px;color:var(--text2);}
.cm-time{font-size:8.5px;color:#1e1e48;}
.cm-b{padding:5px 9px;font-size:12px;line-height:1.4;word-break:break-word;max-width:220px;}
.cm.me .cm-b{background:linear-gradient(135deg,rgba(233,69,96,.18),rgba(233,69,96,.07));border:1px solid rgba(233,69,96,.2);border-radius:9px 9px 2px 9px;color:#f0b8c0;}
.cm.op .cm-b{background:linear-gradient(135deg,rgba(0,200,240,.1),rgba(0,200,240,.03));border:1px solid rgba(0,200,240,.16);border-radius:9px 9px 9px 2px;color:#a8e0f0;}
.cm.sy .cm-b{background:rgba(245,166,35,.07);border:1px solid rgba(245,166,35,.14);border-radius:7px;font-size:10.5px;color:var(--gold);text-align:center;padding:4px 10px;}
.qr-row{display:flex;gap:4px;padding:5px 10px;border-top:1px solid #121228;flex-wrap:wrap;}
.qr{padding:3px 7px;border-radius:12px;font-size:10.5px;cursor:pointer;border:1px solid #181838;color:var(--text2);background:#0a0a1e;transition:all .14s;}
.qr:hover{border-color:rgba(233,69,96,.4);color:var(--red);}
.chat-inp-row{display:flex;gap:5px;padding:6px 10px 8px;border-top:1px solid #121228;width:100%;box-sizing:border-box;}
.cinp{flex:1;min-width:0;background:#07071e;border:1px solid #202050;border-radius:7px;padding:7px 10px;font-size:12px;color:var(--text);font-family:inherit;outline:none;width:0;}
.cinp:focus{border-color:rgba(100,80,200,.5);}
.csend{flex-shrink:0;width:42px;height:36px;border-radius:7px;background:linear-gradient(135deg,#4030a0,#2a1870);border:none;color:#c0b0f0;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.csend:hover{background:linear-gradient(135deg,#5040c0,#3a2890);}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(70px);opacity:0;background:linear-gradient(135deg,#141432,#0a0a1e);border:1px solid rgba(245,166,35,.3);border-radius:12px;padding:9px 16px;font-size:12.5px;color:var(--gold);max-width:320px;text-align:center;z-index:999;transition:all .35s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>

<!-- LOBBY -->
<div id="lobby">
  <div class="card">
    <div style="font-size:38px;text-align:center;margin-bottom:4px;">🦍</div>
    <div class="ltitle">金剛爬塔</div>
    <div class="lsub">躲避滾桶 · 爬上頂端救出公主！</div>
    <div class="field"><label>暱稱</label><input id="nickInp" placeholder="輸入你的暱稱…" maxlength="12" value="玩家"></div>

    <div style="font-size:11px;color:var(--text2);font-weight:700;letter-spacing:.5px;margin-bottom:8px;">🎯 單人難度</div>
    <div class="diff-row">
      <button class="diff-btn" id="d-easy" onclick="setDiff('easy')" style="border-color:rgba(6,214,160,.4);color:#06d6a0;">😊 簡單<span>5命・慢桶</span></button>
      <button class="diff-btn" id="d-normal" onclick="setDiff('normal')" style="border-color:var(--gold);background:rgba(245,166,35,.1);color:var(--gold);box-shadow:0 0 0 1px rgba(245,166,35,.2);">🧑 普通<span>3命・標準</span></button>
      <button class="diff-btn" id="d-hard" onclick="setDiff('hard')" style="border-color:rgba(233,69,96,.4);color:#ff8090;">💀 困難<span>2命・快桶</span></button>
    </div>

    <button class="lbtn" onclick="startSolo()" style="background:linear-gradient(135deg,#4030a0,#2a1870);box-shadow:0 4px 20px rgba(60,30,160,.4),inset 0 1px 0 rgba(255,255,255,.12);">🎮 單人開始（共 5 關）</button>
    <div class="sep"><div class="sep-line"></div><div class="sep-txt">線上對戰</div><div class="sep-line"></div></div>
    <button class="lbtn" onclick="createRoom()" style="background:linear-gradient(135deg,#e94560,#8e1830);box-shadow:0 4px 20px rgba(233,69,96,.4),inset 0 1px 0 rgba(255,255,255,.12);">🔗 建立房間 · 邀請朋友</button>
    <div class="sep"><div class="sep-line"></div><div class="sep-txt">收到邀請碼</div><div class="sep-line"></div></div>
    <input class="code-inp" id="codeInp" placeholder="輸入邀請碼" maxlength="8">
    <button class="lbtn" onclick="joinRoom()" style="background:linear-gradient(135deg,#06b060,#047a40);box-shadow:0 4px 20px rgba(6,160,80,.35),inset 0 1px 0 rgba(255,255,255,.12);margin-bottom:0;">✅ 加入朋友的房間</button>
  </div>
</div>

<!-- GAME -->
<div id="game">
  <header>
    <div class="logo">金剛爬塔 🦍</div>
    <div style="display:flex;gap:5px;">
      <button class="btn" id="soundBtn" style="font-size:14px;padding:5px 10px;" onclick="toggleSound()">🔊</button>
      <button class="btn" style="font-size:11px;padding:5px 10px;" onclick="restartGame()">⟳ 重開</button>
      <button class="btn" style="font-size:11px;padding:5px 10px;" onclick="goLobby()">← 大廳</button>
    </div>
  </header>

  <!-- 我的 HUD -->
  <div class="hud">
    <div class="hud-row">
      <div class="hb"><div class="hb-val" style="color:var(--gold);" id="myScore">0</div><div class="hb-lbl">分數</div></div>
      <div class="hud-div"></div>
      <div class="hb"><div class="hb-val" style="color:var(--red);" id="myLives">❤️❤️❤️</div><div class="hb-lbl">生命</div></div>
      <div class="hud-div"></div>
      <div class="hb"><div class="hb-val" style="color:var(--teal);" id="myLevel">1</div><div class="hb-lbl">關卡</div></div>
      <div class="hud-div"></div>
      <div class="hbar-wrap">
        <div style="font-size:9px;color:var(--text2);">高度</div>
        <div class="hbar-bg"><div class="hbar-fill" id="myHbar" style="width:0%;background:linear-gradient(90deg,var(--red),#c02040);"></div></div>
      </div>
    </div>
  </div>

  <!-- 邀請碼列 -->
  <div class="invite-row" id="inviteRow">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
      <div>
        <div style="font-size:10px;color:var(--text2);margin-bottom:3px;">📋 把邀請碼傳給朋友，他在大廳輸入即可加入</div>
        <div style="font-size:26px;font-weight:900;color:var(--gold);letter-spacing:6px;font-family:monospace;" id="inviteCode"></div>
      </div>
      <div style="display:flex;gap:7px;">
        <button class="btn btn-green" style="font-size:11px;padding:5px 10px;" onclick="copyLink()">📋 複製</button>
        <button class="btn" style="font-size:11px;padding:5px 10px;" onclick="shareLink()">📤 分享</button>
      </div>
    </div>
    <div id="waitRow" style="display:flex;align-items:center;gap:7px;margin-top:7px;">
      <div class="wdot"></div>
      <div style="font-size:11px;color:var(--green);">等待朋友在大廳輸入邀請碼加入…</div>
    </div>
  </div>

  <!-- 對手 HUD -->
  <div class="opp-row" id="oppRow">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
      <div style="font-size:11px;font-weight:700;color:var(--teal);">🎮 <span id="oppName">對手</span></div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="hb"><div class="hb-val" style="color:var(--teal);font-size:15px;" id="oppScore">0</div><div class="hb-lbl">分數</div></div>
        <div class="hb"><div class="hb-val" style="color:var(--teal);font-size:13px;" id="oppLives">-</div><div class="hb-lbl">生命</div></div>
        <div class="hb"><div class="hb-val" style="color:var(--teal);font-size:15px;" id="oppLevel">-</div><div class="hb-lbl">關卡</div></div>
      </div>
      <div style="flex:1;min-width:80px;">
        <div style="font-size:9px;color:var(--text2);margin-bottom:3px;">高度</div>
        <div class="hbar-bg"><div class="hbar-fill" id="oppHbar" style="width:0%;background:linear-gradient(90deg,var(--teal),#0860a0);"></div></div>
      </div>
    </div>
    <div style="font-size:10px;color:var(--text2);margin-top:5px;" id="oppStatus">等待加入…</div>
  </div>

  <!-- Canvas -->
  <div class="canvas-wrap">
    <canvas id="gc" tabindex="0" onclick="focusGame()" style="outline:none;"></canvas>
    <div class="ov" id="mainOv">
      <div class="ov-em" id="ovEm">🦍</div>
      <div class="ov-ttl gold" id="ovTtl">金剛爬塔</div>
      <div class="ov-sub" id="ovSub"></div>
      <div class="ov-btns" id="ovBtns"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="ctrl-row">
    <div class="dpw">
      <div class="dp">
        <button class="db up" id="dUp" onpointerdown="kd('up')" onpointerup="ku('up')" onpointercancel="ku('up')">▲</button>
        <button class="db left" id="dLeft" onpointerdown="kd('left')" onpointerup="ku('left')" onpointercancel="ku('left')">◀</button>
        <button class="db right" id="dRight" onpointerdown="kd('right')" onpointerup="ku('right')" onpointercancel="ku('right')">▶</button>
      </div>
    </div>
    <button class="jb" onpointerdown="kd('jump')" onpointerup="ku('jump')" onpointercancel="ku('jump')">🦘<br><span style="font-size:9px;">跳</span></button>
  </div>
  <div class="hint">🖥️ 電腦：← → 移動 · ↑ 或 空白鍵 跳躍</div>

  <!-- Chat -->
  <div class="chat" id="chatBox">
    <div class="chat-hdr">
      <div class="cdot" id="cDot"></div>
      <div>
        <div style="font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text2);">💬 即時聊天</div>
        <div style="font-size:9.5px;color:#2a2a68;" id="cOnTxt">連線中…</div>
      </div>
    </div>
    <div class="chat-msgs" id="chatMsgs">
      <div class="cm sy"><div class="cm-b">🎮 歡迎！邀請朋友一起對戰！</div></div>
    </div>
    <div class="qr-row">
      <button class="qr" onclick="qr('🔥 超猛！')">🔥猛</button>
      <button class="qr" onclick="qr('💀 被打到了！')">💀死了</button>
      <button class="qr" onclick="qr('🏆 我過關了！')">🏆過關</button>
      <button class="qr" onclick="qr('👏 加油！')">👏加油</button>
      <button class="qr" onclick="qr('🎯 再來一局！')">🎯再來</button>
      <button class="qr" onclick="qr('😂 哈哈哈！')">😂哈哈</button>
    </div>
    <div class="chat-inp-row">
      <input class="cinp" id="chatInp" placeholder="說點什麼…" maxlength="80">
      <button class="csend" onclick="sendChat()">➤</button>
    </div>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script>
// ═══════════════════════════════════
//  SERVER
// ═══════════════════════════════════
const SERVER_URL='https://kong-server-q68o.onrender.com';

// ═══════════════════════════════════
//  SOUND
// ═══════════════════════════════════
let AC=null,soundOn=true;
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function snd(t){if(!soundOn)return;try{const ac=getAC(),n=ac.currentTime;
  if(t==='jump'){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.setValueAtTime(220,n);o.frequency.exponentialRampToValueAtTime(440,n+.12);g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.001,n+.18);o.start(n);o.stop(n+.18);}
  if(t==='hit'){const b=ac.createBuffer(1,ac.sampleRate*.4,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=400;s.buffer=b;s.connect(f);f.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.5,n);g.gain.exponentialRampToValueAtTime(.001,n+.4);s.start(n);}
  if(t==='win'){[523,659,784,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.value=f;const tt=n+i*.1;g.gain.setValueAtTime(.12,tt);g.gain.exponentialRampToValueAtTime(.001,tt+.12);o.start(tt);o.stop(tt+.14);});}
  if(t==='death'){[300,250,200,160].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sawtooth';o.frequency.value=f;const tt=n+i*.1;g.gain.setValueAtTime(.12,tt);g.gain.exponentialRampToValueAtTime(.001,tt+.1);o.start(tt);o.stop(tt+.11);});}
  if(t==='barrel'){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sawtooth';o.frequency.setValueAtTime(80,n);o.frequency.linearRampToValueAtTime(60,n+.15);g.gain.setValueAtTime(.06,n);g.gain.exponentialRampToValueAtTime(.001,n+.15);o.start(n);o.stop(n+.15);}
  if(t==='climb'){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.value=660;g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.001,n+.06);o.start(n);o.stop(n+.06);}
}catch(e){}}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';}

// ═══════════════════════════════════
//  DIFFICULTY & LEVELS
// ═══════════════════════════════════
const DIFF={
  easy:  {lives:5,barrelMul:.6,interval:1.6,label:'😊 簡單'},
  normal:{lives:3,barrelMul:1.0,interval:1.0,label:'🧑 普通'},
  hard:  {lives:2,barrelMul:1.5,interval:.65,label:'💀 困難'},
};
let curDiff='normal';
function setDiff(d){
  curDiff=d;
  ['easy','normal','hard'].forEach(k=>{
    const b=document.getElementById('d-'+k);
    const on=k===d;
    const colors={easy:'rgba(6,214,160',normal:'rgba(245,166,35',hard:'rgba(233,69,96'};
    const c=colors[k];
    b.style.borderColor=on?`${c},1)`:(`${c},.4)`);
    b.style.background=on?(`${c},.12)`):'#0e0e28';
    b.style.boxShadow=on?(`0 0 0 1px ${c},.25)`):'none';
    b.style.transform=on?'scale(1.04)':'scale(1)';
  });
}

const LEVELS=[
  {name:'第1關',desc:'入門爬塔',  bonus:300, flames:0,bBoost:1.0},
  {name:'第2關',desc:'雙桶挑戰',  bonus:600, flames:1,bBoost:1.3},
  {name:'第3關',desc:'三層火焰',  bonus:900, flames:2,bBoost:1.5},
  {name:'第4關',desc:'速度地獄',  bonus:1200,flames:2,bBoost:1.8},
  {name:'第5關',desc:'最終決戰！',bonus:2000,flames:3,bBoost:2.2},
];
const MAX_LVL=5;

// ═══════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════
const cv=document.getElementById('gc');
const ctx=cv.getContext('2d');
const GRAV=0.48;
let platforms=[],ladders=[],barrels=[],flames=[];
let pl={x:0,y:0,vx:0,vy:0,w:28,h:34,onGround:false,dir:1};
let kong={x:0,y:0,w:46,h:46,timer:0};
let princess={x:0,y:0};
let score=0,lives=3,level=1,totalScore=0;
let gState='idle',frames=0,scoreTimer=0;
const keys={left:false,right:false,jump:false,up:false};
const jp={v:false};
let frameId=null;
let soloMode=false,curSoloLv=1;

function CW(){return cv.width;}
function CH(){return cv.height;}
function cellW(){return Math.floor(CW()/12);}
function cellH(){return Math.round(cellW()*1.1);}

// ═══════════════════════════════════
//  BUILD LEVEL
// ═══════════════════════════════════
function buildLevel(lv){
  const W=CW(),H=CH(),CH_=cellH();
  platforms=[];ladders=[];barrels=[];flames=[];
  pl.vx=0;pl.vy=0;pl.onGround=false;
  const layouts=[
    [{y:H-CH_,x:0,w:W},{y:H-CH_*4,x:0,w:W*.85},{y:H-CH_*7,x:W*.15,w:W*.85},{y:H-CH_*10,x:0,w:W*.85},{y:H-CH_*13,x:W*.1,w:W*.9}],
    [{y:H-CH_,x:0,w:W},{y:H-CH_*3.5,x:W*.1,w:W*.9},{y:H-CH_*6.5,x:0,w:W*.85},{y:H-CH_*9.5,x:W*.15,w:W*.85},{y:H-CH_*13,x:W*.05,w:W*.95}],
    [{y:H-CH_,x:0,w:W},{y:H-CH_*4,x:0,w:W*.65},{y:H-CH_*4,x:W*.72,w:W*.28},{y:H-CH_*7.5,x:W*.1,w:W*.8},{y:H-CH_*11,x:0,w:W*.9},{y:H-CH_*13,x:W*.05,w:W*.95}],
    [{y:H-CH_,x:0,w:W},{y:H-CH_*3.5,x:0,w:W*.5},{y:H-CH_*6,x:W*.35,w:W*.65},{y:H-CH_*8.5,x:0,w:W*.6},{y:H-CH_*11,x:W*.3,w:W*.7},{y:H-CH_*13,x:W*.05,w:W*.95}],
    [{y:H-CH_,x:0,w:W},{y:H-CH_*3,x:W*.05,w:W*.45},{y:H-CH_*3,x:W*.55,w:W*.45},{y:H-CH_*6,x:0,w:W*.55},{y:H-CH_*6,x:W*.6,w:W*.4},{y:H-CH_*9,x:W*.1,w:W*.8},{y:H-CH_*13,x:W*.05,w:W*.95}],
  ];
  const ladderSets=[
    [{x:W*.12,y:H-CH_*4,h:CH_*3},{x:W*.78,y:H-CH_*7,h:CH_*3},{x:W*.22,y:H-CH_*10,h:CH_*3},{x:W*.72,y:H-CH_*13,h:CH_*3}],
    [{x:W*.15,y:H-CH_*3.5,h:CH_*2.5},{x:W*.75,y:H-CH_*6.5,h:CH_*3},{x:W*.2,y:H-CH_*9.5,h:CH_*3},{x:W*.7,y:H-CH_*13,h:CH_*3}],
    [{x:W*.55,y:H-CH_*4,h:CH_*3.5},{x:W*.12,y:H-CH_*7.5,h:CH_*3.5},{x:W*.75,y:H-CH_*11,h:CH_*3.5},{x:W*.4,y:H-CH_*13,h:CH_*2}],
    [{x:W*.45,y:H-CH_*3.5,h:CH_*2.5},{x:W*.12,y:H-CH_*6,h:CH_*2.5},{x:W*.62,y:H-CH_*8.5,h:CH_*2.5},{x:W*.35,y:H-CH_*11,h:CH_*2.5}],
    [{x:W*.4,y:H-CH_*3,h:CH_*2},{x:W*.15,y:H-CH_*6,h:CH_*3},{x:W*.7,y:H-CH_*6,h:CH_*3},{x:W*.45,y:H-CH_*9,h:CH_*3}],
  ];
  const layout=layouts[Math.min(lv-1,layouts.length-1)];
  layout.forEach((p,i)=>platforms.push({...p,h:7,dark:i%2===0}));
  ladders=ladderSets[Math.min(lv-1,ladderSets.length-1)];
  const topP=platforms[platforms.length-1];
  kong.x=topP.x+10;kong.y=topP.y;
  princess.x=topP.x+topP.w-50;princess.y=topP.y;
  pl.x=14;pl.y=H-CH_-pl.h;
  const lc=LEVELS[Math.min(lv-1,LEVELS.length-1)];
  const dc=DIFF[curDiff];
  if(lc.flames>0)flames.push({x:W*.3,y:H-CH_-18,vx:1.5*lc.bBoost,f:0});
  if(lc.flames>1)flames.push({x:W*.65,y:H-CH_-18,vx:-1.7*lc.bBoost,f:0});
  if(lc.flames>2&&platforms[2])flames.push({x:W*.5,y:platforms[2].y-18,vx:1.3*lc.bBoost,f:0});
  kong.timer=Math.round(Math.max(45,110-lv*10)*.8);
}

// ═══════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════
function loop(){
  frameId=requestAnimationFrame(loop);
  frames++;
  if(gState==='playing')tick();
  draw();
  // 廣播給對方（每4幀，online模式，playing/win/gameover都廣播）
  if(!soloMode&&frames%4===0&&socket&&socket.connected&&gState!=='idle'){
    const topY=platforms[platforms.length-1]?.y||0;
    const ht=Math.max(0,Math.min(100,Math.round(100*(1-(pl.y-topY)/(CH()-topY)))));
    socket.emit('state',{score,lives,level,ht,nick:myNick,state:gState});
  }
}

function tick(){
  const W=CW(),H=CH();
  pl.vx=0;
  if(keys.left){pl.vx=-3.5;pl.dir=-1;}
  if(keys.right){pl.vx=3.5;pl.dir=1;}
  // 跳躍 — 在重力之前，用上幀 onGround
  const jp_=keys.jump||keys.up;
  if(jp_&&pl.onGround&&!jp.v){pl.vy=-12;pl.onGround=false;jp.v=true;snd('jump');}
  if(!jp_)jp.v=false;
  // 爬梯
  let onLad=false;
  for(const l of ladders){
    if(pl.x+pl.w*.5>l.x-9&&pl.x+pl.w*.5<l.x+20&&pl.y+pl.h>l.y&&pl.y<l.y+l.h&&keys.up){
      pl.vy=-2.8;onLad=true;if(frames%14===0)snd('climb');
    }
  }
  if(!onLad){pl.vy+=GRAV;if(pl.vy>16)pl.vy=16;}
  pl.x+=pl.vx;pl.y+=pl.vy;
  pl.x=Math.max(0,Math.min(W-pl.w,pl.x));
  // 平台碰撞
  pl.onGround=false;
  for(const p of platforms){
    if(pl.x+pl.w>p.x+2&&pl.x<p.x+p.w-2){
      const feet=pl.y+pl.h;
      if(feet>=p.y&&feet<=p.y+18&&pl.vy>=0){pl.y=p.y-pl.h;pl.vy=0;pl.onGround=true;}
    }
  }
  // 桶子
  const dc=DIFF[curDiff],lc=LEVELS[Math.min(level-1,LEVELS.length-1)];
  kong.timer++;
  const intv=Math.max(45,Math.round((110-level*10)*dc.interval));
  if(kong.timer>=intv){kong.timer=0;barrels.push({x:kong.x+kong.w,y:kong.y+kong.h*.5,w:19,h:19,vx:2.4*dc.barrelMul*lc.bBoost,vy:0,f:0});snd('barrel');}
  for(let i=barrels.length-1;i>=0;i--){const b=barrels[i];b.vy+=GRAV*.7;b.x+=b.vx;b.y+=b.vy;for(const p of platforms)if(b.x+b.w>p.x&&b.x<p.x+p.w&&b.y+b.h>=p.y&&b.y+b.h<=p.y+15&&b.vy>=0){b.y=p.y-b.h;b.vy=0;if(level>1&&Math.random()<.22)b.vx*=-1;}if(b.x<-30||b.x>W+50||b.y>H+80)barrels.splice(i,1);if(frames%4===0)b.f=(b.f+1)%4;}
  for(const f of flames){f.x+=f.vx;if(f.x<0||f.x>W-18)f.vx*=-1;if(frames%6===0)f.f=(f.f+1)%4;}
  // 碰撞
  for(const b of barrels)if(Math.abs(pl.x+14-(b.x+9))<19&&Math.abs(pl.y+17-(b.y+9))<19){onHit();return;}
  for(const f of flames)if(Math.abs(pl.x+14-f.x)<20&&Math.abs(pl.y+17-f.y)<20){onHit();return;}
  if(pl.y>H+40){onHit();return;}
  if(Math.abs(pl.x-princess.x)<40&&Math.abs(pl.y-princess.y)<48){onWin();return;}
  // 計分
  scoreTimer++;
  const topY=platforms[platforms.length-1]?.y||0;
  const ht=Math.max(0,Math.min(1,1-(pl.y-topY)/(H-topY)));
  // 問題1修正：只有在爬高（ht>5%）時才加時間分，站在地板不加分
  if(scoreTimer%60===0&&ht>0.05){score+=10*level;updateMyHUD();}
  // 高度分：只有在地板以上才加
  if(scoreTimer%12===0&&ht>0.08)score+=Math.floor(ht*4);
  document.getElementById('myHbar').style.width=Math.round(ht*100)+'%';
}

// ═══════════════════════════════════
//  DRAW
// ═══════════════════════════════════
function draw(){
  const W=CW(),H=CH(),CW_=cellW();
  if(!W||!H)return;
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#07071a');bg.addColorStop(1,'#101028');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.25)';
  for(let i=0;i<22;i++)ctx.fillRect((i*83+11)%W,(i*57+7)%H,1,1);
  for(const p of platforms){const pg=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h+6);pg.addColorStop(0,p.dark?'#4848a0':'#505098');pg.addColorStop(1,p.dark?'#2a2a60':'#303068');ctx.fillStyle=pg;ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(p.x,p.y,p.w,2);}
  for(const l of ladders){ctx.fillStyle='rgba(170,110,50,.65)';ctx.fillRect(l.x,l.y,4,l.h);ctx.fillRect(l.x+13,l.y,4,l.h);for(let ry=l.y+8;ry<l.y+l.h;ry+=13){ctx.fillStyle='rgba(210,150,70,.6)';ctx.fillRect(l.x,ry,17,3);}}
  for(const b of barrels){ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);ctx.rotate(b.f*.38*(b.vx>0?1:-1));const bg2=ctx.createRadialGradient(-2,-2,1,0,0,b.w*.5);bg2.addColorStop(0,'#c08040');bg2.addColorStop(1,'#804020');ctx.fillStyle=bg2;ctx.beginPath();ctx.ellipse(0,0,b.w*.47,b.h*.47,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#5a2810';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,0,b.w*.47,b.h*.47,0,0,Math.PI*2);ctx.stroke();ctx.restore();}
  for(const f of flames){['#ff3010','#ff7000','#ffcc00'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();const s=(14-i*3)*(1+Math.sin(frames*.2+f.x)*.08);ctx.ellipse(f.x,f.y-i*4,s*.5,s*.9,0,0,Math.PI*2);ctx.fill();});}
  const platY=kong.y,cs=Math.round(CW_*.85);
  ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.font=`${cs}px sans-serif`;
  const pM=ctx.measureText('👸');ctx.fillText('👸',princess.x+14,platY-(pM.actualBoundingBoxDescent||0));
  const kM=ctx.measureText('🦍');ctx.fillText('🦍',kong.x+kong.w/2,platY-(kM.actualBoundingBoxDescent||0));
  const em=pl.onGround?(pl.vx!==0?'🏃':'🧍'):'🤸';
  ctx.font=`${Math.round(CW_*.95)}px sans-serif`;
  ctx.save();if(pl.dir===-1){ctx.scale(-1,1);ctx.fillText(em,-(pl.x+pl.w/2),pl.y+pl.h);}else ctx.fillText(em,pl.x+pl.w/2,pl.y+pl.h);ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.font='bold 10px monospace';ctx.textAlign='left';ctx.fillText(`${score}分`,6,16);
}

// ═══════════════════════════════════
//  GAME EVENTS
// ═══════════════════════════════════
function onHit(){
  lives--;snd('hit');
  if(!soloMode)broadcastEvent('hit',`💥 ${myNick} 被擊中！剩 ${lives} 命`);
  updateMyHUD();
  if(lives<=0){
    gState='gameover';setTimeout(()=>snd('death'),300);
    if(!soloMode)broadcastEvent('gameover',`💀 ${myNick} 遊戲結束！分數 ${score}`);
    showOv('💀','遊戲結束',`分數 ${score}`,`<button class="btn btn-red" onclick="restartGame()">再來一局</button><button class="btn" onclick="goLobby()">回大廳</button>`);
  } else {
    showOv('💥','被擊中！',`剩 ${lives} 命`,`<button class="btn btn-red" onclick="respawn()">繼續 ▶</button><button class="btn" onclick="restartGame()">重開</button>`);
  }
}
function respawn(){pl.x=14;pl.y=CH()-cellH()-pl.h;pl.vx=0;pl.vy=0;pl.onGround=false;barrels=[];gState='playing';hideOv();focusGame();}
function onWin(){
  const lc=LEVELS[Math.min(level-1,LEVELS.length-1)];
  score+=lc.bonus;totalScore=score;gState='win';snd('win');updateMyHUD();
  // 立即廣播最終正確分數
  if(!soloMode&&socket&&socket.connected){
    socket.emit('state',{score,lives,level,ht:0,nick:myNick,state:'win'});
    broadcastEvent('win',`🏆 ${myNick} 以 ${score} 分完成${lc.name}！`);
  }
  if(soloMode){
    if(level>=MAX_LVL){
      showOv('🏆','全關通關！',`難度：${DIFF[curDiff].label}\n總分：${score}`,`<button class="btn btn-red" onclick="startSolo()">再挑戰</button><button class="btn" onclick="goLobby()">回大廳</button>`);
    } else {
      showOv('🎉',`${lc.name}過關！`,`獎勵 +${lc.bonus}　累計 ${score} 分`,`<button class="btn btn-green" onclick="nextSoloLv()">下一關 →</button><button class="btn" onclick="restartGame()">重開</button>`);
    }
  } else {
    showOv('🏆','過關！',`分數 ${score}　${lc.name}`,`<button class="btn btn-green" onclick="nextOnlineLv()">下一關 →</button><button class="btn" onclick="restartGame()">重開</button>`);
  }
}
function nextSoloLv(){curSoloLv++;level=curSoloLv;gState='playing';barrels=[];flames=[];scoreTimer=0;buildLevel(level);hideOv();updateMyHUD();focusGame();}
function nextOnlineLv(){level=Math.min(level+1,3);gState='playing';barrels=[];buildLevel(level);hideOv();updateMyHUD();focusGame();}

function updateMyHUD(){
  document.getElementById('myScore').textContent=score;
  document.getElementById('myLevel').textContent=level;
  const dc=DIFF[curDiff],ml=soloMode?dc.lives:3;
  document.getElementById('myLives').textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,ml-lives));
}
function updateOppHUD(d){
  document.getElementById('oppScore').textContent=d.score||0;
  document.getElementById('oppLevel').textContent=`第${d.level||1}關`;

}
function showOv(em,ttl,sub,btns){
  document.getElementById('ovEm').textContent=em;
  document.getElementById('ovTtl').textContent=ttl;
  document.getElementById('ovSub').textContent=sub;
  document.getElementById('ovBtns').innerHTML=btns||'';

function hideOv(){document.getElementById('mainOv').classList.remove('show');}
function focusGame(){cv.focus();}

// ═══════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════
function kd(k){if(k==='left')keys.left=true;if(k==='right')keys.right=true;if(k==='up')keys.up=true;if(k==='jump')keys.jump=true;document.getElementById('d'+k[0].toUpperCase()+k.slice(1))?.classList.add('pressed');}
function ku(k){if(k==='left')keys.left=false;if(k==='right')keys.right=false;if(k==='up')keys.up=false;if(k==='jump')keys.jump=false;document.getElementById('d'+k[0].toUpperCase()+k.slice(1))?.classList.remove('pressed');}
function handleKey(e,dn){
  if(document.activeElement.tagName==='INPUT')return;
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'){if(dn)e.preventDefault();dn?kd('left'):ku('left');}
  if(k==='ArrowRight'||k==='d'){if(dn)e.preventDefault();dn?kd('right'):ku('right');}
  if(k==='ArrowUp'||k==='w'){if(dn)e.preventDefault();dn?kd('up'):ku('up');dn?kd('jump'):ku('jump');}
  if(k===' '||k==='z'){if(dn)e.preventDefault();dn?kd('jump'):ku('jump');}
}
document.addEventListener('keydown',e=>handleKey(e,true),true);
document.addEventListener('keyup',e=>handleKey(e,false),true);
window.addEventListener('resize',()=>{if(document.getElementById('game').style.display!=='none'){cv.width=Math.min(window.innerWidth-18,540);cv.height=Math.round(cv.width*1.28);buildLevel(level);}});

let myNick='玩家',myRoom='',inviteLink='',soloModeActive=false;
let socket=null,oppConnected=false;
const seenMsgs=new Set();

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtT(ts){return new Date(ts).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});}

function renderMsg(data){
  const id=data.id||(data.ts+'_'+(data.nick||''));
  if(seenMsgs.has(id))return;
  seenMsgs.add(id);
  const isMe=data.nick===myNick,isSys=data.type==='system';
  const el=document.getElementById('chatMsgs');
  const w=document.createElement('div');
  if(isSys){
    w.className='cm sy';
    w.innerHTML=`<div class="cm-b">${esc(data.text||'')}</div>`;
  } else {
    w.className='cm '+(isMe?'me':'op');
    const color=isMe?'var(--red)':'var(--teal)';
    const ava=isMe?'😊':'🎮';
    w.innerHTML=`<div class="cm-meta"><div class="cm-ava" style="background:${color}22;">${ava}</div><span class="cm-name" style="color:${color}">${esc(data.nick||'')}</span><span class="cm-time">${fmtT(data.ts||Date.now())}</span></div><div class="cm-b">${esc(data.text||'')}</div>`;
  }
  el.appendChild(w);
  el.scrollTop=el.scrollHeight;
}

// sysMsg：本地顯示 + 廣播
function sysMsg(text){
  const msg={type:'system',text,ts:Date.now(),nick:'系統',id:'sys'+Date.now()+Math.random()};
  renderMsg(msg);
  if(socket&&socket.connected&&!soloMode) socket.emit('chat',msg);
}

// broadcastEvent：只廣播，不本地顯示
function broadcastEvent(type,text){
  if(!socket||!socket.connected)return;
  const msg={type:'system',text,ts:Date.now(),nick:'系統',id:'evt'+Date.now()+Math.random()};
  socket.emit('chat',msg);
  renderMsg(msg); // 自己也看到
}

// sendChat：自己打的字
function sendChat(text){
  const inp=document.getElementById('chatInp');
  const val=(text||inp.value).trim();
  if(!val)return;
  if(!text)inp.value='';
  const msg={nick:myNick,text:val,ts:Date.now(),type:'chat',id:'msg'+Date.now()+Math.random()};
  renderMsg(msg); // 自己先顯示
  if(socket&&socket.connected) socket.emit('chat',msg); // 發給伺服器廣播
}
function qr(t){sendChat(t);}
document.getElementById('chatInp').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}
});

// ═══════════════════════════════════
//  SOCKET — 乾淨的事件架構
// ═══════════════════════════════════
function connectSocket(){
  if(socket&&socket.connected)return;
  socket=io(SERVER_URL,{transports:['websocket','polling']});

  socket.on('connect',()=>{
    document.getElementById('cDot').classList.add('on');
    document.getElementById('cOnTxt').textContent='已連線';
    // 加入房間
    socket.emit('join_room',{roomCode:myRoom,nick:myNick});
  });

  socket.on('disconnect',()=>{
    document.getElementById('cDot').classList.remove('on');
    document.getElementById('cOnTxt').textContent='已斷線';
  });

  // 房間人員更新
  socket.on('room_update',data=>{
    const others=(data.players||[]).filter(p=>p.id!==socket.id);
    if(others.length>0&&!oppConnected){
      oppConnected=true;
      const oNick=others[0].nick||'朋友';
      document.getElementById('oppName').textContent=oNick;
      document.getElementById('oppRow').classList.add('show');
      // 更新等待列
      document.getElementById('waitRow').innerHTML=`<div style="display:flex;align-items:center;gap:7px;"><div style="width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px rgba(245,166,35,.5);"></div><div style="font-size:11px;color:var(--gold);font-weight:700;">${oNick} 已加入！雙方在線 🎮</div></div>`;
      toast(`👥 ${oNick} 加入了！`);
      showOv('🤝',`${oNick} 加入了！`,'雙方都在線，開始對戰吧！',`<button class="btn btn-red" onclick="beginGame()">▶ 開始！</button>`);
      // 廣播給雙方
      const msg={type:'system',text:`🎮 ${oNick} 加入房間！可以開始對戰了！`,ts:Date.now(),nick:'系統',id:'join'+Date.now()};
      socket.emit('chat',msg);
      renderMsg(msg);
    }
  });

  // 收到對方狀態（分數、生命、關卡、高度）
  socket.on('state',data=>{
    if(data.nick&&data.nick!==myNick){
      updateOppHUD(data);
    }
  });

  // 收到聊天訊息
  socket.on('chat',data=>{
    if(data.nick!==myNick){ // 只顯示對方的，自己的已本地顯示
      renderMsg(data);
    }
  });

  // 歷史訊息
  socket.on('chat_history',msgs=>{
    msgs.forEach(m=>{
      if(m.nick!==myNick) renderMsg(m);
    });
  });
}

// ═══════════════════════════════════
//  LOBBY ACTIONS
// ═══════════════════════════════════
function startSolo(){
  myNick=document.getElementById('nickInp').value.trim()||'玩家';
  localStorage.setItem('kongNick',myNick);
  soloMode=true;soloModeActive=true;curSoloLv=1;totalScore=0;
  showGameScreen(true);
  showOv('🦍',LEVELS[0].name,`${LEVELS[0].desc}　難度：${DIFF[curDiff].label}`,`<button class="btn btn-red" onclick="beginGame()">▶ 開始！</button>`);
}

function createRoom(){
  myNick=document.getElementById('nickInp').value.trim()||'玩家';
  localStorage.setItem('kongNick',myNick);
  soloMode=false;soloModeActive=false;
  myRoom=Math.random().toString(36).slice(2,8).toUpperCase();
  const base=location.href.split('?')[0];
  inviteLink=`${base}?room=${myRoom}`;
  showGameScreen(false);
  document.getElementById('inviteRow').classList.add('show');
  document.getElementById('inviteCode').textContent=myRoom;
  showOv('🦍','等待朋友加入','把邀請碼傳給朋友！\n朋友加入後開始遊戲。','');
  connectSocket();
}

function joinRoom(){
  myNick=document.getElementById('nickInp').value.trim()||'玩家';
  localStorage.setItem('kongNick',myNick);
  const code=document.getElementById('codeInp').value.trim().toUpperCase();
  if(!code){toast('請輸入邀請碼！');return;}
  soloMode=false;soloModeActive=false;myRoom=code;
  showGameScreen(false);
  showOv('⏳','連線中…','正在加入房間，請稍候…','');
  connectSocket();
}

function beginGame(){
  score=soloMode?totalScore:0;
  lives=DIFF[curDiff].lives;
  level=soloMode?curSoloLv:1;
  gState='playing';scoreTimer=0;frames=0;barrels=[];flames=[];
  buildLevel(level);hideOv();updateMyHUD();
  setTimeout(focusGame,50);
  if(!soloMode)sysMsg(`🎮 ${myNick} 開始遊戲！第 ${level} 關`);
}

function restartGame(){
  if(soloMode){curSoloLv=1;totalScore=0;}
  score=0;lives=DIFF[curDiff].lives;level=1;
  gState='playing';scoreTimer=0;frames=0;barrels=[];flames=[];
  buildLevel(1);hideOv();updateMyHUD();
  setTimeout(focusGame,50);
  if(!soloMode)sysMsg(`🔄 ${myNick} 重新開始`);
}

function showGameScreen(solo){
  document.getElementById('lobby').style.display='none';
  document.getElementById('game').style.display='block';
  cv.width=Math.min(window.innerWidth-18,540);
  cv.height=Math.round(cv.width*1.28);
  buildLevel(1);updateMyHUD();
  // 聊天室和對手面板
  if(solo){
    document.getElementById('chatBox').classList.remove('show');
    document.getElementById('oppRow').classList.remove('show');
    document.getElementById('inviteRow').classList.remove('show');
  } else {
    document.getElementById('chatBox').classList.add('show');
  }
  if(frameId)cancelAnimationFrame(frameId);
  frameId=null;
  loop();
}

function goLobby(){
  if(frameId){cancelAnimationFrame(frameId);frameId=null;}
  gState='idle';soloMode=false;oppConnected=false;
  document.getElementById('chatBox').classList.remove('show');
  document.getElementById('oppRow').classList.remove('show');
  document.getElementById('inviteRow').classList.remove('show');
  document.getElementById('lobby').style.display='block';
  document.getElementById('game').style.display='none';
  hideOv();
}

function copyLink(){navigator.clipboard?.writeText(inviteLink).then(()=>toast('📋 連結已複製！')).catch(()=>prompt('複製：',inviteLink));}
function shareLink(){if(navigator.share)navigator.share({title:'金剛爬塔邀請',text:`來對戰！邀請碼：${myRoom}`,url:inviteLink}).catch(()=>copyLink());else copyLink();}

// ═══════════════════════════════════
//  TOAST
// ═══════════════════════════════════
let tTmr=null;
function toast(msg){const el=document.getElementById('toastEl');el.textContent=msg;el.classList.add('show');if(tTmr)clearTimeout(tTmr);tTmr=setTimeout(()=>el.classList.remove('show'),3200);}

// ═══════════════════════════════════
//  BOOT
// ═══════════════════════════════════
const sn=localStorage.getItem('kongNick');
if(sn)document.getElementById('nickInp').value=sn;
const urlP=new URLSearchParams(location.search);
if(urlP.get('room'))document.getElementById('codeInp').value=urlP.get('room');
setDiff('normal');
</script>
